# Database lokal untuk demo. Nilai diambil dari .env yang sama dengan Laravel.
name: lola-sport-demo
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-lola}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Jalankan npm run setup terlebih dahulu}
      POSTGRES_DB: ${DB_DATABASE:-lola_demo}
    ports:
      - "127.0.0.1:${DB_PORT:-55433}:5432"
    volumes:
      - lola_demo_postgres:/var/lib/postgresql/data
      - ./infra/postgres/01-test-database.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  lola_demo_postgres:
